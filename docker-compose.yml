services:
  # ==================== FRONTEND (Quasar SPA) ====================
  frontend:
    image: ${DOCKER_USERNAME:-portfolio}/portfolio-frontend:${TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: portfolio-frontend
    restart: on-failure
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true
